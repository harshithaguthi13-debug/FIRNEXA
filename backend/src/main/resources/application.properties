# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/police_fir_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Secret & Expiration (24 hours)
app.jwt.secret=9a4f2c8d7e1b5a3f6c8d2e1a4b7c9e3f5a1b3c5d7e9f2a4b6c8d1e3f5a7b9c1d
app.jwt.expiration-ms=86400000

# File Upload Configuration (Max 50MB for evidence videos and CCTV files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
